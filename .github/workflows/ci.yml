name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job runs mise run check, which loops over every module in GO_MODULES
# with the workspace off.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run check
        run: mise run check
